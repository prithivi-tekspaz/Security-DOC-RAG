[package]
name = "security-doc-rag"
version = "0.1.0"
edition = "2021"
description = "Local security documentation agent built on Rig and Ollama"

[dependencies]
rig = { package = "rig-core", version = "0.44", features = ["derive", "pdf"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
